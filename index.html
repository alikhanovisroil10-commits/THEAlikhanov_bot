<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY MUSIC PLAYER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .header { font-size: 24px; font-weight: bold; color: #1db954; margin-bottom: 20px; text-transform: uppercase; }
        .search-box { width: 100%; max-width: 400px; display: flex; background: #282828; border-radius: 20px; padding: 5px 15px; margin-bottom: 20px; }
        .search-box input { width: 100%; background: transparent; border: none; outline: none; color: #fff; padding: 10px; font-size: 16px; }
        .search-box button { background: transparent; border: none; color: #1db954; font-size: 18px; cursor: pointer; }
        .results-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 100px; }
        .track-card { display: flex; align-items: center; background: #181818; border-radius: 10px; padding: 10px; cursor: pointer; }
        .track-card:hover { background: #282828; }
        .track-card img { width: 50px; height: 50px; border-radius: 6px; margin-right: 12px; object-fit: cover; }
        .track-info { flex-grow: 1; overflow: hidden; }
        .track-title { font-size: 15px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 13px; color: #b3b3b3; margin-top: 3px; }
        .player-bar { position: fixed; bottom: 10px; width: calc(100% - 20px); max-width: 400px; background: #282828; border-radius: 15px; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .player-info { display: flex; align-items: center; gap: 10px; width: 70%; overflow: hidden; }
        .player-info img { width: 45px; height: 45px; border-radius: 6px; }
        .play-btn { width: 45px; height: 45px; border-radius: 50%; background: #1db954; border: none; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <!-- Nomini shu yerdan o'zgartirishingiz mumkin -->
    <div class="header" id="appTitle">MUSIC PLAYER</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Qo'shiq yoki ijrochi nomi..." onkeypress="if(event.key==='Enter') searchMusic()">
        <button onclick="searchMusic()"><i class="fas fa-search"></i></button>
    </div>

    <div class="results-container" id="results">
        <p style="text-align: center; color: #b3b3b3;">Qidiruvga biron bir nom yozing...</p>
    </div>

    <div class="player-bar" id="playerBar" style="display: none;">
        <div class="player-info">
            <img id="currentCover" src="" alt="cover">
            <div class="track-info">
                <div class="track-title" id="currentTitle">Musiqa nomi</div>
                <div class="track-artist" id="currentArtist">Xonanda</div>
            </div>
        </div>
        <button class="play-btn" onclick="togglePlay()"><i class="fas fa-play" id="playIcon"></i></button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        let isPlaying = false;

        async function searchMusic() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p style="text-align: center; color: #b3b3b3;">Qidirilmoqda...</p>';

            // Muammolarsiz va bepul ochiq Jamendo API
            const url = `https://api.jamendo.com/v3.0/tracks/?client_id=c8b6b230&format=json&limit=20&namesearch=${encodeURIComponent(query)}&include=musicinfo`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                resultsDiv.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align: center; color: #b3b3b3;">Musiqa topilmadi.</p>';
                    return;
                }

                data.results.forEach(track => {
                    const card = document.createElement('div');
                    card.className = 'track-card';
                    const cover = track.album_image || track.image || 'https://via.placeholder.com/150';

                    card.onclick = () => playTrack(track.audio, track.name, track.artist_name, cover);

                    card.innerHTML = `
                        <img src="${cover}" alt="cover">
                        <div class="track-info">
                            <div class="track-title">${track.name}</div>
                            <div class="track-artist">${track.artist_name}</div>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (error) {
                resultsDiv.innerHTML = '<p style="text-align: center; color: #ff5555;">Server bilan ulanishda xatolik bo\'ldi.</p>';
            }
        }

        function playTrack(audioUrl, title, artist, cover) {
            audio.src = audioUrl;
            audio.play();
            isPlaying = true;

            document.getElementById('currentTitle').innerText = title;
            document.getElementById('currentArtist').innerText = artist;
            document.getElementById('currentCover').src = cover;
            document.getElementById('playerBar').style.display = 'flex';
            document.getElementById('playIcon').className = 'fas fa-pause';
        }

        function togglePlay() {
            const playIcon = document.getElementById('playIcon');
            if (isPlaying) {
                audio.pause();
                playIcon.className = 'fas fa-play';
            } else {
                audio.play();
                playIcon.className = 'fas fa-pause';
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
