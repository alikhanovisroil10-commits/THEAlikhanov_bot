<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Neighbourhood</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        h1 { color: #ff4757; }
        .box { background: #1c1c1e; padding: 15px; margin: 10px auto; max-width: 350px; border-radius: 10px; cursor: pointer; }
        audio { margin-top: 20px; width: 300px; }
    </style>
</head>
<body>
    <h1>The Neighbourhood Vibe</h1>
    <p>Qo'shiqni tanlang:</p>

    <div class="box" onclick="play('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 'Sweater Weather')">
        <b>Sweater Weather</b>
    </div>
    <div class="box" onclick="play('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 'Afraid')">
        <b>Afraid</b>
    </div>

    <div>
        <audio id="player" controls></audio>
    </div>

    <script>
        function play(url, name) {
            const p = document.getElementById('player');
            p.src = url;
            p.play();
        }
    </script>
</body>
</html>
