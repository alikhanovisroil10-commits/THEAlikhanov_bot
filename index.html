<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRADZIU Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0d0a1a;
            color: #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .search-box {
            width: 100%;
            max-width: 400px;
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 4px 12px;
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 10px;
            font-size: 15px;
        }
        .search-box button {
            background: transparent;
            border: none;
            color: #ff007f;
            font-size: 18px;
            cursor: pointer;
            padding: 0 8px;
        }
        .results-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 90px;
        }
        .track-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .track-card:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.98);
        }
        .track-card img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 12px;
        }
        .track-info {
            flex-grow: 1;
            overflow: hidden;
        }
        .track-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 12px;
            color: #aaa;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-bar {
            position: fixed;
            bottom: 15px;
            width: calc(100% - 30px);
            max-width: 400px;
            background: rgba(20, 15, 38, 0.95);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 18px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            width: 70%;
        }
        .player-info img {
            width: 40px;
            height: 40px;
            border-radius: 6px;
        }
        .play-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="header">KRADZIU MUSIC</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Qo'shiq yoki xonanda nomi..." onkeypress="if(event.key === 'Enter') startSearch()">
        <button onclick="startSearch()"><i class="fas fa-search"></i></button>
    </div>

    <div class="results-container" id="results">
        <p style="text-align: center; color: #888; font-size: 14px; margin-top: 20px;">Qidiruvga musiqa nomini kiriting...</p>
    </div>

    <div class="player-bar" id="playerBar" style="display: none;">
        <div class="player-info">
            <img id="currentCover" src="" alt="cover">
            <div class="track-info">
                <div class="track-title" id="currentTitle">Musiqa nomi</div>
                <div class="track-artist" id="currentArtist">Xonanda</div>
            </div>
        </div>
        <button class="play-btn" onclick="togglePlay()"><i class="fas fa-play" id="playIcon"></i></button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        let isPlaying = false;

        function startSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p style="text-align: center; color: #888;">Qidirilmoqda...</p>';

            // Eski script bo'lsa o'chiramiz
            const oldScript = document.getElementById('api_script');
            if (oldScript) oldScript.remove();

            // Timeout orqali agar server javob bermasa xabar berish
            const searchTimeout = setTimeout(() => {
                if(resultsDiv.innerHTML.includes('Qidirilmoqda...')) {
                    resultsDiv.innerHTML = '<p style="text-align: center; color: #ff4d4d;">Tarmoqda xatolik bo\'ldi, qayta urinib ko\'ring.</p>';
                }
            }, 8000);

            // iTunes JSONP API orqali qidiruv
            window.handleMusicResults = function(data) {
                clearTimeout(searchTimeout);
                resultsDiv.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align: center; color: #888;">Hech narsa topilmadi.</p>';
                    return;
                }

                data.results.forEach(track => {
                    if (!track.previewUrl) return;

                    const card = document.createElement('div');
                    card.className = 'track-card';
                    
                    const cover = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '300x300bb') : '';
                    
                    card.onclick = () => playTrack(track.previewUrl, track.trackName, track.artistName, cover);

                    card.innerHTML = `
                        <img src="${cover}" alt="cover">
                        <div class="track-info">
                            <div class="track-title">${escapeHtml(track.trackName)}</div>
                            <div class="track-artist">${escapeHtml(track.artistName)}</div>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });
            };

            const script = document.createElement('script');
            script.id = 'api_script';
            script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=25&callback=handleMusicResults`;
            script.onerror = () => {
                clearTimeout(searchTimeout);
                resultsDiv.innerHTML = '<p style="text-align: center; color: #ff4d4d;">Qidiruv serveriga ulanishda xatolik.</p>';
            };
            document.body.appendChild(script);
        }

        function playTrack(audioUrl, title, artist, cover) {
            audio.src = audioUrl;
            audio.play().then(() => {
                isPlaying = true;
                document.getElementById('playIcon').className = 'fas fa-pause';
            }).catch(e => {
                console.log("Play error", e);
            });

            document.getElementById('currentTitle').innerText = title;
            document.getElementById('currentArtist').innerText = artist;
            document.getElementById('currentCover').src = cover;
            document.getElementById('playerBar').style.display = 'flex';
        }

        function togglePlay() {
            const playIcon = document.getElementById('playIcon');
            if (isPlaying) {
                audio.pause();
                playIcon.className = 'fas fa-play';
            } else {
                audio.play();
                playIcon.className = 'fas fa-pause';
            }
            isPlaying = !isPlaying;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
