<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Player App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0055;
            --secondary: #7600ff;
            --bg-color: #0d0a1a;
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            padding-bottom: 110px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }

        .app-name {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff0055, #a055ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Container */
        .search-box {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px 45px 14px 18px;
            border-radius: 18px;
            color: #fff;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .search-box button {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
        }

        /* Banner */
        .hero-banner {
            padding: 18px;
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.25), rgba(118, 0, 255, 0.25));
            border: 1px solid var(--card-border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .hero-text h2 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .hero-text p {
            font-size: 12px;
            color: #b5b5b5;
        }

        .hero-icon {
            font-size: 32px;
            color: var(--primary);
        }

        /* Results List */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .track-card {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .track-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.15);
        }

        .track-card img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 14px;
        }

        .track-details {
            flex: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: #a0a0a0;
            margin-top: 3px;
        }

        .play-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
        }

        /* Bottom Player Bar */
        .player-bar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(20, 15, 35, 0.95);
            border: 1px solid rgba(255, 0, 85, 0.4);
            border-radius: 20px;
            padding: 10px 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            z-index: 100;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 70%;
        }

        .player-left img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
        }

        .player-info {
            overflow: hidden;
        }

        .player-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 11px;
            color: #888;
        }

        .main-play-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            color: #777;
            padding: 40px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="app-brand">
            <div class="app-logo"><i class="fas fa-compact-disc"></i></div>
            <div class="app-name">MY MUSIC APP</div>
        </div>
        <i class="fas fa-fire" style="color: #ff0055; font-size: 20px;"></i>
    </div>

    <!-- Search Box -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Qo'shiq nomi yoki xonanda..." onkeypress="if(event.key==='Enter') searchMusic()">
        <button onclick="searchMusic()"><i class="fas fa-search"></i></button>
    </div>

    <!-- Banner -->
    <div class="hero-banner">
        <div class="hero-text">
            <h2>Musiqiy Olam</h2>
            <p>Istalgan musiqa nomini qidiring va eshiting</p>
        </div>
        <div class="hero-icon">
            <i class="fas fa-headphones-alt"></i>
        </div>
    </div>

    <!-- Natijalar -->
    <div class="results-container" id="results">
        <div class="empty-state">
            <i class="fas fa-music" style="font-size: 36px; margin-bottom: 12px; color: #444;"></i>
            <p>Qo'shiq nomini yozing va qidiruv tugmasini bosing</p>
        </div>
    </div>

    <!-- Pastki Pleyer Bar -->
    <div class="player-bar" id="playerBar">
        <div class="player-left">
            <img id="currentCover" src="" alt="cover">
            <div class="player-info">
                <div class="player-title" id="currentTitle">Musiqa nomi</div>
                <div class="player-artist" id="currentArtist">Xonanda</div>
            </div>
        </div>
        <button class="main-play-btn" onclick="togglePlay()"><i class="fas fa-pause" id="playIcon"></i></button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        let isPlaying = false;

        async function searchMusic() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin" style="font-size: 32px; color: var(--primary);"></i>
                    <p style="margin-top: 10px;">Musiqalar qidirilmoqda...</p>
                </div>
            `;

            try {
                // Piped API - YouTube bazasidan qidirish (Block bo'lmaydi va har qanday musiqani topadi)
                const response = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=music_songs`);
                const data = await response.json();

                resultsDiv.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="font-size: 32px;"></i>
                            <p style="margin-top: 10px;">Musiqa topilmadi.</p>
                        </div>
                    `;
                    return;
                }

                data.items.slice(0, 15).forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'track-card';
                    const cover = item.thumbnail || 'https://via.placeholder.com/100';
                    const videoId = item.url.split('v=')[1];

                    card.onclick = () => loadAndPlayTrack(videoId, item.title, item.uploaderName, cover);

                    card.innerHTML = `
                        <img src="${cover}" alt="cover">
                        <div class="track-details">
                            <div class="track-title">${item.title}</div>
                            <div class="track-artist">${item.uploaderName}</div>
                        </div>
                        <div class="play-icon-btn">
                            <i class="fas fa-play"></i>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wifi" style="font-size: 32px; color: var(--primary);"></i>
                        <p style="margin-top: 10px;">Ulanishda xatolik. Qayta urinib ko'ring.</p>
                    </div>
                `;
            }
        }

        async function loadAndPlayTrack(videoId, title, artist, cover) {
            document.getElementById('currentTitle').innerText = title;
            document.getElementById('currentArtist').innerText = artist;
            document.getElementById('currentCover').src = cover;
            document.getElementById('playerBar').style.display = 'flex';

            try {
                // Audio havolasini olish
                const res = await fetch(`https://pipedapi.kavin.rocks/streams/${videoId}`);
                const data = await res.json();

                // Eng yaxshi sifatli audio faylini tanlash
                const audioStream = data.audioStreams.find(s => s.mimeType.includes('audio/webm') || s.mimeType.includes('audio/mp4'));
                
                if (audioStream && audioStream.url) {
                    audio.src = audioStream.url;
                    audio.play();
                    isPlaying = true;
                    document.getElementById('playIcon').className = 'fas fa-pause';
                }
            } catch (e) {
                alert("Audio faylini yuklashda xatolik yuz berdi.");
            }
        }

        function togglePlay() {
            const playIcon = document.getElementById('playIcon');
            if (isPlaying) {
                audio.pause();
                playIcon.className = 'fas fa-play';
            } else {
                audio.play();
                playIcon.className = 'fas fa-pause';
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
