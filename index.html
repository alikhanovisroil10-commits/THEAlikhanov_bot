<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRADZIU Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            width: 250px;
            height: 250px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 20px; }
        p { color: #aaa; }
    </style>
</head>
<body>
    <div class="card">Your Mix</div>
    <h2>Fallen Star</h2>
    <p>The Neighbourhood</p>
</body>
</html>
