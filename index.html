<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonWave Music App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-purple: #7000ff;
            --bg-dark: #0a0813;
            --card-glass: rgba(255, 255, 255, 0.05);
            --card-border: rgba(0, 243, 255, 0.2);
            --text-main: #ffffff;
            --text-dim: #9490a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 10%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 120px;
        }

        /* App Bar */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        .brand-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Box */
        .search-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .search-wrapper input {
            width: 100%;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            padding: 16px 50px 16px 20px;
            border-radius: 20px;
            color: #fff;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .search-wrapper input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
        }

        .search-wrapper button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 14px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Track Grid / Cards */
        .track-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .track-card {
            display: flex;
            align-items: center;
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 18px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .track-card:active {
            transform: scale(0.98);
            border-color: var(--neon-cyan);
        }

        .track-card img {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            object-fit: cover;
            margin-right: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .track-meta {
            flex: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .track-artist {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .play-btn-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon-cyan);
            font-size: 12px;
        }

        /* Modern Bottom Floating Player */
        .floating-player {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: rgba(18, 15, 30, 0.9);
            border: 1px solid var(--neon-pink);
            border-radius: 24px;
            padding: 10px 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.2);
            z-index: 100;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 65%;
        }

        .player-info img {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            object-fit: cover;
        }

        .player-text {
            overflow: hidden;
        }

        .player-title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 11px;
            color: var(--text-dim);
        }

        .play-trigger {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .state-box {
            text-align: center;
            color: var(--text-dim);
            padding: 50px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-wave-square"></i></div>
            <div class="brand-text">NEON WAVE</div>
        </div>
        <i class="fas fa-bolt" style="color: var(--neon-cyan); font-size: 18px;"></i>
    </div>

    <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Qo'shiq nomi yoki ijrochi..." onkeypress="if(event.key==='Enter') searchTracks()">
        <button onclick="searchTracks()"><i class="fas fa-search"></i></button>
    </div>

    <div class="track-grid" id="results">
        <div class="state-box">
            <i class="fas fa-compact-disc" style="font-size: 40px; color: var(--neon-purple); margin-bottom: 12px;"></i>
            <p>Musiqa nomini yozing va qidiruvni bosing</p>
        </div>
    </div>

    <div class="floating-player" id="playerBar">
        <div class="player-info">
            <img id="playerCover" src="" alt="cover">
            <div class="player-text">
                <div class="player-title" id="playerTitle">Noma'lum</div>
                <div class="player-artist" id="playerArtist">Ijrochi</div>
            </div>
        </div>
        <button class="play-trigger" onclick="togglePlay()"><i class="fas fa-pause" id="playBtnIcon"></i></button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        let isPlaying = false;

        // iTunes API integratsiyasi (Ishonchli va blokka tushmaydigan)
        async function searchTracks() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="state-box">
                    <i class="fas fa-spinner fa-spin" style="font-size: 32px; color: var(--neon-pink);"></i>
                    <p style="margin-top: 12px;">Qidirilmoqda...</p>
                </div>
            `;

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=20`);
                const data = await response.json();

                resultsDiv.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = `<div class="state-box"><p>Musiqa topilmadi.</p></div>`;
                    return;
                }

                data.results.forEach(track => {
                    const card = document.createElement('div');
                    card.className = 'track-card';
                    const cover = track.artworkUrl100.replace('100x100bb', '300x300bb');

                    card.onclick = () => playAudio(track.previewUrl, track.trackName, track.artistName, cover);

                    card.innerHTML = `
                        <img src="${cover}" alt="cover">
                        <div class="track-meta">
                            <div class="track-title">${track.trackName}</div>
                            <div class="track-artist">${track.artistName}</div>
                        </div>
                        <div class="play-btn-circle">
                            <i class="fas fa-play"></i>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (err) {
                resultsDiv.innerHTML = `<div class="state-box"><p>Ulanishda xatolik yuz berdi. Qayta urinib ko'ring.</p></div>`;
            }
        }

        function playAudio(url, title, artist, cover) {
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerArtist').innerText = artist;
            document.getElementById('playerCover').src = cover;
            document.getElementById('playerBar').style.display = 'flex';

            audio.src = url;
            audio.play();
            isPlaying = true;
            document.getElementById('playBtnIcon').className = 'fas fa-pause';
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                document.getElementById('playBtnIcon').className = 'fas fa-play';
            } else {
                audio.play();
                document.getElementById('playBtnIcon').className = 'fas fa-pause';
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
