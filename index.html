<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0055;
            --secondary: #7600ff;
            --bg-color: #0b0914;
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 18px 10px;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }

        .app-name {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff0055, #a055ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* Search Section */
        .search-container {
            padding: 10px 18px 20px;
        }

        .search-box {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px 45px 14px 18px;
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .search-box button {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
        }

        /* Hero Banner */
        .hero-banner {
            margin: 0 18px 20px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(118, 0, 255, 0.2));
            border: 1px solid var(--card-border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .hero-text h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .hero-text p {
            font-size: 12px;
            color: #b5b5b5;
        }

        .hero-icon {
            font-size: 32px;
            color: var(--primary);
        }

        /* Section Title */
        .section-title {
            padding: 0 18px 12px;
            font-size: 16px;
            font-weight: 700;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Track List */
        .results-container {
            padding: 0 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .track-card {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .track-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.12);
        }

        .track-card img {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 14px;
        }

        .track-details {
            flex: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: #a0a0a0;
            margin-top: 3px;
        }

        .play-icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 14px;
        }

        /* Player Modal / Bar */
        .player-bar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(18, 14, 32, 0.92);
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 20px;
            padding: 10px 15px;
            display: none;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            z-index: 100;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 65%;
        }

        .player-left img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
        }

        .player-info {
            overflow: hidden;
        }

        .player-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 11px;
            color: #888;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(255, 0, 85, 0.4);
        }

        /* Player Video Container */
        .video-box {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 200;
            display: none;
            flex-direction: column;
        }

        .video-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.8);
        }

        .close-video-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        iframe {
            width: 100%;
            height: calc(100% - 60px);
            border: none;
        }

        .empty-state {
            text-align: center;
            color: #777;
            padding: 40px 20px;
            font-size: 14px;
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="top-bar">
        <div class="app-brand">
            <div class="app-logo"><i class="fas fa-compact-disc"></i></div>
            <div class="app-name">MUSIC PLAYER</div>
        </div>
        <i class="fas fa-fire" style="color: #ff0055; font-size: 20px;"></i>
    </div>

    <!-- Search Box -->
    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Musiqa yoki xonanda ismi..." onkeypress="if(event.key==='Enter') searchMusic()">
            <button onclick="searchMusic()"><i class="fas fa-search"></i></button>
        </div>
    </div>

    <!-- Banner -->
    <div class="hero-banner">
        <div class="hero-text">
            <h2>Cheksiz Musiqa</h2>
            <p>Istalgan qo'shig'ingizni qidiring</p>
        </div>
        <div class="hero-icon">
            <i class="fas fa-headphones-alt"></i>
        </div>
    </div>

    <!-- Section Title -->
    <div class="section-title">
        <i class="fas fa-list-ul" style="color: var(--primary);"></i>
        <span>Natijalar</span>
    </div>

    <!-- Results List -->
    <div class="results-container" id="results">
        <div class="empty-state">
            <i class="fas fa-music"></i>
            <p>Sevimli qo'shig'ingiz nomini yozing va qidiring</p>
        </div>
    </div>

    <!-- Player Bottom Bar -->
    <div class="player-bar" id="playerBar">
        <div class="player-left">
            <img id="currentCover" src="https://via.placeholder.com/150" alt="cover">
            <div class="player-info">
                <div class="player-title" id="currentTitle">Musiqa nomi</div>
                <div class="player-artist" id="currentArtist">Ijrochi</div>
            </div>
        </div>
        <div class="player-controls">
            <button class="main-play-btn" onclick="openPlayer()"><i class="fas fa-play"></i></button>
        </div>
    </div>

    <!-- Fullscreen Player -->
    <div class="video-box" id="videoBox">
        <div class="video-header">
            <span style="font-weight: 600;" id="videoTitle">Ijro etilmoqda</span>
            <button class="close-video-btn" onclick="closePlayer()"><i class="fas fa-times"></i></button>
        </div>
        <iframe id="youtubePlayer" src="" allow="autoplay"></iframe>
    </div>

    <script>
        let currentVideoId = '';

        async function searchMusic() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin" style="color: var(--primary);"></i>
                    <p>Musiqalar qidirilmoqda...</p>
                </div>
            `;

            try {
                const response = await fetch(`https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
                const data = await response.json();

                resultsDiv.innerHTML = '';

                if (!data || data.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <p>Hech narsa topilmadi</p>
                        </div>
                    `;
                    return;
                }

                data.slice(0, 15).forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'track-card';
                    const cover = video.videoThumbnails && video.videoThumbnails.length > 0 
                        ? video.videoThumbnails[0].url 
                        : 'https://via.placeholder.com/150';

                    card.onclick = () => selectTrack(video.videoId, video.title, video.author, cover);

                    card.innerHTML = `
                        <img src="${cover}" alt="cover">
                        <div class="track-details">
                            <div class="track-title">${video.title}</div>
                            <div class="track-artist">${video.author}</div>
                        </div>
                        <div class="play-icon-btn">
                            <i class="fas fa-play"></i>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wifi" style="color: #ff0055;"></i>
                        <p>Ulanishda xatolik bo'ldi. Qayta urinib ko'ring.</p>
                    </div>
                `;
            }
        }

        function selectTrack(videoId, title, artist, cover) {
            currentVideoId = videoId;
            document.getElementById('currentTitle').innerText = title;
            document.getElementById('currentArtist').innerText = artist;
            document.getElementById('currentCover').src = cover;
            document.getElementById('playerBar').style.display = 'flex';
            openPlayer();
        }

        function openPlayer() {
            if (!currentVideoId) return;
            const videoBox = document.getElementById('videoBox');
            const iframe = document.getElementById('youtubePlayer');
            document.getElementById('videoTitle').innerText = document.getElementById('currentTitle').innerText;
            iframe.src = `https://www.youtube.com/embed/${currentVideoId}?autoplay=1`;
            videoBox.style.display = 'flex';
        }

        function closePlayer() {
            const videoBox = document.getElementById('videoBox');
            const iframe = document.getElementById('youtubePlayer');
            iframe.src = '';
            videoBox.style.display = 'none';
        }
    </script>
</body>
</html>
