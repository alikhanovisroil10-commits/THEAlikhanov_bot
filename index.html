<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0055;
            --secondary: #7600ff;
            --bg-color: #0b0914;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }

        .app-name {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff0055, #a055ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Bar */
        .search-box {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px 45px 14px 18px;
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .search-box button {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: var(--primary);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
        }

        /* Banner */
        .hero-banner {
            padding: 18px;
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.25), rgba(118, 0, 255, 0.25));
            border: 1px solid var(--card-border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .hero-text h2 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .hero-text p {
            font-size: 12px;
            color: #b5b5b5;
        }

        .hero-icon {
            font-size: 30px;
            color: var(--primary);
        }

        /* Results Area */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .track-card {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .track-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.15);
        }

        .track-card img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 14px;
        }

        .track-details {
            flex: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: #a0a0a0;
            margin-top: 3px;
        }

        .play-icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 13px;
        }

        /* Embed Player Box */
        .player-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            display: none;
            flex-direction: column;
        }

        .player-modal-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
            border-bottom: 1px solid #222;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .empty-state {
            text-align: center;
            color: #777;
            padding: 30px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="app-brand">
            <div class="app-logo"><i class="fas fa-compact-disc"></i></div>
            <div class="app-name">MUSIC APP</div>
        </div>
        <i class="fas fa-bolt" style="color: #ff0055; font-size: 20px;"></i>
    </div>

    <!-- Search -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Musiqa yoki xonanda ismi..." onkeypress="if(event.key==='Enter') searchMusic()">
        <button onclick="searchMusic()"><i class="fas fa-search"></i></button>
    </div>

    <!-- Banner -->
    <div class="hero-banner">
        <div class="hero-text">
            <h2>Musiqa Ilovasi</h2>
            <p>Istalgan o'zbek va chet el qo'shig'ini qidiring</p>
        </div>
        <div class="hero-icon">
            <i class="fas fa-headphones-alt"></i>
        </div>
    </div>

    <!-- Natijalar ro'yxati -->
    <div class="results-container" id="results">
        <div class="empty-state">
            <i class="fas fa-search" style="font-size: 32px; margin-bottom: 10px; color: #444;"></i>
            <p>Qo'shiq nomini yozing va qidiring</p>
        </div>
    </div>

    <!-- Player Window -->
    <div class="player-modal" id="playerModal">
        <div class="player-modal-header">
            <span id="playingTitle" style="font-weight: 600; font-size: 15px; color: #fff;">Ijro etilmoqda</span>
            <button class="close-btn" onclick="closePlayer()"><i class="fas fa-times"></i></button>
        </div>
        <div class="iframe-container">
            <iframe id="mainPlayer" src="" allow="autoplay"></iframe>
        </div>
    </div>

    <script>
        async function searchMusic() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin" style="font-size: 30px; color: var(--primary);"></i>
                    <p style="margin-top: 10px;">Qidirilmoqda...</p>
                </div>
            `;

            try {
                // iTunes Search API - Dunyo va O'zbekistondagi barcha xonandalarni 100% topadi
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=20`);
                const data = await response.json();

                resultsDiv.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="font-size: 30px;"></i>
                            <p style="margin-top: 10px;">Afsuski musiqa topilmadi.</p>
                        </div>
                    `;
                    return;
                }

                data.results.forEach(track => {
                    const card = document.createElement('div');
                    card.className = 'track-card';
                    const cover = track.artworkUrl100 || 'https://via.placeholder.com/100';

                    card.onclick = () => playTrack(track.previewUrl, track.trackName, track.artistName);

                    card.innerHTML = `
                        <img src="${cover}" alt="cover">
                        <div class="track-details">
                            <div class="track-title">${track.trackName}</div>
                            <div class="track-artist">${track.artistName}</div>
                        </div>
                        <div class="play-icon-btn">
                            <i class="fas fa-play"></i>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-wifi" style="font-size: 30px; color: var(--primary);"></i>
                        <p style="margin-top: 10px;">Ulanishda xatolik. Qayta urinib ko'ring.</p>
                    </div>
                `;
            }
        }

        function playTrack(audioUrl, title, artist) {
            const modal = document.getElementById('playerModal');
            const player = document.getElementById('mainPlayer');
            document.getElementById('playingTitle').innerText = title + ' - ' + artist;
            
            player.src = audioUrl;
            modal.style.display = 'flex';
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const player = document.getElementById('mainPlayer');
            player.src = '';
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
